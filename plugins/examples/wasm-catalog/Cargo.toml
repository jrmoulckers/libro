# Example WASM catalog plugin (guest).
#
# Built for `wasm32-unknown-unknown`, NOT the host — excluded from the root
# workspace (see the root Cargo.toml `exclude`). Build the committed fixture with:
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown \
#     --manifest-path plugins/examples/wasm-catalog/Cargo.toml
#   copy target/wasm32-unknown-unknown/release/libro_wasm_catalog_example.wasm
#        plugins/example-wasm-catalog.wasm
#
# The tests run against the committed `plugins/example-wasm-catalog.wasm`, so a
# wasm toolchain is NOT required to run the suite.
[package]
name = "libro-wasm-catalog-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep the committed `.wasm` fixture small.
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
