# =============================================================================
# Libro CI
# =============================================================================
#
# This file is PRODUCT-OWNED. Reusable workflows are "native" to the JRM Studio
# sync engine: it resolves and reports them but never writes them into member
# repos (see jrmoulckers/.github sync/lib/assets.mjs). Edit freely here.
#
# Every input below is declared in the corresponding reusable workflow's
# `on.workflow_call.inputs` block — nothing is guessed.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    permissions:
      contents: read
      pull-requests: read
    with:
      node-version: '22'
      package-manager: pnpm
      lint-command: pnpm lint
      format-check-command: pnpm format:check
      semantic-pr-title: true

  web:
    name: Web CI
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    permissions:
      contents: read
    with:
      node-version: '22'
      package-manager: pnpm
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm build
      artifact-name: libro-web-build
      artifact-path: dist
      artifact-retention-days: 7

  security:
    name: Security CI
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    permissions:
      contents: read
    with:
      node-version: '22'
      package-manager: pnpm
      run-package-audit: true
      run-secret-scan: true
      run-dependency-review: true
      dependency-fail-severity: high

  preview:
    name: Preview Artifact
    if: github.event_name == 'pull_request'
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    permissions:
      contents: read
    with:
      node-version: '22'
      package-manager: pnpm
      build-command: pnpm build
      output-dir: dist
      artifact-name: ${{ needs.web.outputs.artifact-name }}

  perf:
    name: Performance Budget
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    permissions:
      contents: read
    with:
      node-version: '22'
      package-manager: pnpm
      build-command: pnpm build
      output-dir: dist
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      bundle-budget-kb: 2048
      # Lighthouse is skipped while `url` is empty. Set it once a stable preview
      # or production URL exists; lhci-min-performance / lhci-min-accessibility
      # then default to 90 / 95.
      url: ''
      lhci-min-performance: 90
      lhci-min-accessibility: 95
      lighthouse-public-upload: false
