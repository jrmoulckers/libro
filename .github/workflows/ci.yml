# =============================================================================
# Libro CI
# =============================================================================
#
# This file is PRODUCT-OWNED. Reusable workflows are "native" to the JRM Studio
# sync engine: it resolves and reports them but never writes them into member
# repos (see jrmoulckers/.github sync/lib/assets.mjs). Edit freely here.
#
# Every input below is declared in the corresponding reusable workflow's
# `on.workflow_call.inputs` block — nothing is guessed.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    permissions:
      contents: read
      packages: read
      pull-requests: read
    with:
      node-version: '22'
      package-manager: pnpm
      lint-command: pnpm lint
      format-check-command: pnpm format:check
      semantic-pr-title: true
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web CI
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    permissions:
      contents: read
      packages: read
    with:
      node-version: '22'
      package-manager: pnpm
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm build
      artifact-name: libro-web-build
      artifact-path: dist
      artifact-retention-days: 7
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security CI
    # NOTE: reusable-security-ci does not yet accept registry-url / registry-scope
    # or a NODE_AUTH_TOKEN secret. Its `pnpm audit` resolves advisory metadata from
    # whatever registry the @jrmoulckers scope is routed to, so it will 401 once
    # an @jrmoulckers/* dependency enters package.json. Harmless today because
    # libro has no such dependency. Blocks part two — see issue #25.
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    permissions:
      contents: read
    with:
      node-version: '22'
      package-manager: pnpm
      run-package-audit: true
      run-secret-scan: true
      # Libro does not currently have the GitHub dependency graph capability required by this job.
      run-dependency-review: false
      dependency-fail-severity: high

  preview:
    name: Preview Artifact
    if: github.event_name == 'pull_request'
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    permissions:
      contents: read
      packages: read
    with:
      node-version: '22'
      package-manager: pnpm
      build-command: pnpm build
      output-dir: dist
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  perf:
    name: Performance Budget
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    permissions:
      contents: read
      packages: read
    with:
      node-version: '22'
      package-manager: pnpm
      build-command: pnpm build
      output-dir: dist
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      bundle-budget-kb: 2048
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
      # Lighthouse is skipped while `url` is empty. Set it once a stable preview
      # or production URL exists; lhci-min-performance / lhci-min-accessibility
      # then default to 90 / 95.
      url: ''
      lhci-min-performance: 90
      lhci-min-accessibility: 95
      lighthouse-public-upload: false
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
